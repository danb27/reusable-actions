name: Terraform Plan

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Terraform root configuration'
        required: false
        type: string
        default: '.'
    secrets:
      AWS_ROLE:
        description: 'AWS role ARN to assume via OIDC'
        required: true
      TF_VARS_JSON:
        description: >-
          Optional JSON object of Terraform variable values, written to
          ci.auto.tfvars.json in the working directory. Use for values that
          should not live in the repository.
        required: false
      PROVIDER_ENV_JSON:
        description: >-
          Optional JSON object of environment variables for Terraform providers,
          e.g. {"CLOUDFLARE_API_TOKEN": "..."}. Keeps this workflow free of a
          named secret per provider.
        required: false

# Callers must grant: id-token: write, contents: read, pull-requests: write.

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-west-2
          role-session-name: TerraformPlan

      # The emptiness checks live in the shell because the secrets context is
      # not available to a step-level `if`.
      - name: Write variable file
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          if [ -n "${TF_VARS_JSON}" ]; then
            printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
          fi

      # Provider credentials are environment variables, not Terraform
      # variables, so they arrive as one JSON object rather than a named secret
      # per provider. GitHub masks the blob but not the values inside it, so
      # each is masked explicitly before anything can log it.
      - name: Export provider credentials
        env:
          PROVIDER_ENV_JSON: ${{ secrets.PROVIDER_ENV_JSON }}
        run: |
          if [ -z "${PROVIDER_ENV_JSON}" ]; then
            exit 0
          fi
          jq -r '.[] | select(type == "string")' <<< "${PROVIDER_ENV_JSON}" \
            | while IFS= read -r value; do
                echo "::add-mask::${value}"
              done
          jq -r 'to_entries[] | "\(.key)<<__TF_PROVIDER_ENV__\n\(.value)\n__TF_PROVIDER_ENV__"' \
            <<< "${PROVIDER_ENV_JSON}" >> "${GITHUB_ENV}"

      - name: Init
        run: terraform init -input=false

      # -lock=false because a plan writes nothing. Without it, a plan on a pull
      # request can block an apply running on the default branch.
      #
      # No separate `terraform validate` step: plan performs the same checks and
      # fails on anything validate would catch.
      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt

          # A fingerprint of the semantic change set - resource addresses, the
          # actions, and the before/after values - sorted so key order cannot
          # affect it, and with none of the timestamps or progress noise that
          # make the human-readable output differ between identical runs.
          #
          # The JSON is piped straight into shasum and never printed: it
          # contains sensitive attribute values in cleartext.
          fingerprint=$(terraform show -json tfplan \
            | jq -S '[.resource_changes[] | {address, actions: .change.actions, before: .change.before, after: .change.after}]' \
            | shasum -a 256 | cut -d' ' -f1)
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Comment plan on pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          PLAN_PATH: ${{ inputs.working-directory }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            // GitHub rejects comments over 65536 characters.
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n...truncated, see the workflow log for the full plan.'
              : raw;

            const marker = `<!-- terraform-plan:${{ inputs.working-directory }} -->`;
            // The apply workflow reads this back to confirm it is applying the
            // change set that was actually reviewed.
            const fingerprint =
              `<!-- terraform-plan-fingerprint:${{ inputs.working-directory }}:${{ steps.plan.outputs.fingerprint }} -->`;
            const comment = `${marker}\n${fingerprint}\n### Terraform plan \`${{ inputs.working-directory }}\`\n\n\`\`\`terraform\n${body}\n\`\`\``;

            const { data: existing } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const previous = existing.find((c) => c.body.startsWith(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body: comment,
              });
            }
