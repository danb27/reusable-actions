name: Terraform Plan

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Terraform root configuration'
        required: false
        type: string
        default: '.'
    secrets:
      AWS_ROLE:
        description: 'AWS role ARN to assume via OIDC'
        required: true
      TF_VARS_JSON:
        description: >-
          Optional JSON object of Terraform variable values, written to
          ci.auto.tfvars.json in the working directory. Use for values that
          should not live in the repository.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: 'Optional Cloudflare API token, exported for the Cloudflare provider'
        required: false

# Callers must grant: id-token: write, contents: read, pull-requests: write.

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1
          role-session-name: TerraformPlan

      # The emptiness check lives in the shell because the secrets context is
      # not available to a step-level `if`.
      - name: Write variable file
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          if [ -n "${TF_VARS_JSON}" ]; then
            printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
          fi

      - name: Init
        run: terraform init -input=false

      # -lock=false because a plan writes nothing. Without it, a plan on a pull
      # request can block an apply running on the default branch.
      #
      # No separate `terraform validate` step: plan performs the same checks and
      # fails on anything validate would catch.
      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -lock=false -no-color | tee plan.txt

      - name: Comment plan on pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        env:
          PLAN_PATH: ${{ inputs.working-directory }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            // GitHub rejects comments over 65536 characters.
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n...truncated, see the workflow log for the full plan.'
              : raw;

            const marker = `<!-- terraform-plan:${{ inputs.working-directory }} -->`;
            const comment = `${marker}\n### Terraform plan \`${{ inputs.working-directory }}\`\n\n\`\`\`terraform\n${body}\n\`\`\``;

            const { data: existing } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const previous = existing.find((c) => c.body.startsWith(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body: comment,
              });
            }
