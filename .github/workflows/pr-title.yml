name: PR Title

on:
  workflow_call:
    inputs:
      types:
        description: 'Allowed conventional commit types, one per line'
        required: false
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert

permissions:
  pull-requests: read

# Repositories that squash-merge get one commit per pull request, taken from
# the pull request title - so the title is what release-please reads to decide
# the version bump and write the changelog. A title that is not a conventional
# commit is silently skipped, which is a quiet way to lose a release.
jobs:
  lint:
    name: Lint title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          # The title is the commit subject, so hold it to the same standard:
          # lower case, no trailing period.
          subjectPattern: '^(?![A-Z])(?!.*\.$).+$'
          subjectPatternError: >-
            The subject "{subject}" is invalid: start it lower case and drop any
            trailing full stop, since it becomes the commit subject line.
