name: Terraform Apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Terraform root configuration'
        required: false
        type: string
        default: '.'
      environment:
        description: >-
          Optional GitHub environment to run in. Attach required reviewers to it
          for a manual gate: the job pauses before the runner starts, so
          environment-scoped secrets are not issued until someone approves.
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE:
        description: 'AWS role ARN to assume via OIDC'
        required: true
      TF_VARS_JSON:
        description: >-
          Optional JSON object of Terraform variable values, written to
          ci.auto.tfvars.json in the working directory.
        required: false
      PROVIDER_ENV_JSON:
        description: >-
          Optional JSON object of environment variables for Terraform providers,
          e.g. {"CLOUDFLARE_API_TOKEN": "..."}. Keeps this workflow free of a
          named secret per provider.
        required: false

# Callers must grant: id-token: write, contents: read, pull-requests: read -
# the last is needed to read back the plan that was reviewed.
# Callers should also set a `concurrency` group so two merges cannot apply the
# same state at once.

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-west-2
          role-session-name: TerraformApply

      # The emptiness checks live in the shell because the secrets context is
      # not available to a step-level `if`.
      - name: Write variable file
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          if [ -n "${TF_VARS_JSON}" ]; then
            printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
          fi

      # Provider credentials are environment variables, not Terraform
      # variables, so they arrive as one JSON object rather than a named secret
      # per provider. GitHub masks the blob but not the values inside it, so
      # each is masked explicitly before anything can log it.
      - name: Export provider credentials
        env:
          PROVIDER_ENV_JSON: ${{ secrets.PROVIDER_ENV_JSON }}
        run: |
          if [ -z "${PROVIDER_ENV_JSON}" ]; then
            exit 0
          fi
          jq -r '.[] | select(type == "string")' <<< "${PROVIDER_ENV_JSON}" \
            | while IFS= read -r value; do
                echo "::add-mask::${value}"
              done
          jq -r 'to_entries[] | "\(.key)<<__TF_PROVIDER_ENV__\n\(.value)\n__TF_PROVIDER_ENV__"' \
            <<< "${PROVIDER_ENV_JSON}" >> "${GITHUB_ENV}"

      - name: Init
        run: terraform init -input=false

      # Re-plans, then refuses to continue unless the change set matches the
      # one fingerprinted on the pull request that produced this commit. This
      # is what makes "what was reviewed" and "what gets applied" the same
      # thing rather than two plans that merely happened to agree.
      - name: Verify the plan matches what was reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ inputs.working-directory }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > plan.txt

          actual=$(terraform show -json tfplan \
            | jq -S '[.resource_changes[] | {address, actions: .change.actions, before: .change.before, after: .change.after}]' \
            | shasum -a 256 | cut -d' ' -f1)

          # A squash merge rewrites the SHA, but GitHub still maps the commit
          # back to its pull request, so the reviewed plan stays findable.
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            echo "::error::No pull request found for ${GITHUB_SHA}. Refusing to apply an unreviewed plan."
            exit 1
          fi

          expected=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            --jq "[.[].body
                   | select(test(\"terraform-plan-fingerprint:${DIR}:\"))
                   | capture(\"terraform-plan-fingerprint:${DIR}:(?<f>[0-9a-f]{64})\").f] | last // empty")
          if [ -z "${expected}" ]; then
            echo "::error::Pull request #${pr} has no plan fingerprint for '${DIR}'."
            exit 1
          fi

          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Plan changed since review (reviewed ${expected}, now ${actual}). Re-run the plan and get it re-approved."
            exit 1
          fi

          echo "Change set matches the plan reviewed on #${pr}."

      # Applies the saved plan file rather than re-planning, so Terraform
      # itself rejects it if state moved between the check above and now.
      - name: Apply
        run: terraform apply -input=false tfplan
