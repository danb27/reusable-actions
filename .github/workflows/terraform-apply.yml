name: Terraform Apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Terraform root configuration'
        required: false
        type: string
        default: '.'
      environment:
        description: >-
          Optional GitHub environment to run in. Attach required reviewers to it
          for a manual gate: the job pauses before the runner starts, so
          environment-scoped secrets are not issued until someone approves.
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE:
        description: 'AWS role ARN to assume via OIDC'
        required: true
      TF_VARS_JSON:
        description: >-
          Optional JSON object of Terraform variable values, written to
          ci.auto.tfvars.json in the working directory.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: 'Optional Cloudflare API token, exported for the Cloudflare provider'
        required: false

# Callers must grant: id-token: write, contents: read.
# Callers should also set a `concurrency` group so two merges cannot apply the
# same state at once.

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1
          role-session-name: TerraformApply

      # The emptiness check lives in the shell because the secrets context is
      # not available to a step-level `if`.
      - name: Write variable file
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          if [ -n "${TF_VARS_JSON}" ]; then
            printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
          fi

      - name: Init
        run: terraform init -input=false

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -input=false -auto-approve
